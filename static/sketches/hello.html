      function setup() {
        createCanvas(800, 400)
        spacing = 10
        cols = width / spacing
        rows = height / spacing
        radius = 2
        noStroke()
      }

      function draw() {
        // background(220);

        cursor("pencil.png")

        for (let x = 0 + radius; x <= width - radius; x += spacing) {
          for (let y = 0 + radius; y <= height - radius; y += spacing) {
            let [a, b] = xy_to_cell(x - radius, y - radius)
            if (data[b][a] == 1) {
              // Cor dos quadradinhos
              fill("#49a078")
              circle(a * spacing + radius + spacing / 2, b * spacing + radius + spacing / 2, 8)
              // rect(a * spacing + radius , b * spacing + radius, spacing)
            }

            // Cor dos pontinhos
            fill("#dad7cd")
            circle(x, y, radius)
          }
        }

        for (let i = 0; i <= data.length; i++) {
          if (data[i] == 1) {
            let pos = i * spacing
            print("on")
          }
        }

        // Cor dos quadradinhos
        fill("#49a078")
        if (mouseIsPressed) {
          let [x, y] = xy_to_cell(mouseX, mouseY)
          // rect(x * spacing + radius, y * spacing + radius, spacing)
          circle(x * spacing + radius + spacing / 2, y * spacing + radius + spacing / 2, 8)
        }
      }

      function xy_to_cell(x, y) {
        let cellx = floor(x / spacing)
        let celly = floor(y / spacing)
        return [cellx, celly]
      }
